<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Открытки</title>
    <link rel="stylesheet" href="../practice.css?v=20261026-single1" />
  </head>
  <body class="practice pr4">
    <main class="cards-page">
      <h1>Сделать открытку</h1>
      <div class="card-maker">
        <form id="card-form" novalidate>
          <label for="card-text">Поздравление</label>
          <textarea id="card-text" rows="4" placeholder="Напиши что-нибудь хорошее"></textarea>
          <div class="names-row">
            <div>
              <label for="card-from">От кого</label><input id="card-from" type="text" />
            </div>
            <div><label for="card-to">Кому</label><input id="card-to" type="text" /></div>
          </div>
          <label for="card-theme">Оформление</label>
          <select id="card-theme">
            <option value="linen">Светлая</option>
            <option value="night">Ночная</option>
            <option value="sunset">Розовая</option>
            <option value="garden">Зелёная</option>
            <option value="winter">Зимняя</option>
          </select>
          <button id="send" type="submit" disabled>Отправить</button>
          <p id="card-status" class="status-line" role="status"></p>
        </form>
        <div id="preview" class="postcard theme-linen">
          <small id="preview-to">Кому</small>
          <p id="preview-text">Текст поздравления</p>
          <small id="preview-from">От кого</small>
        </div>
      </div>
      <section class="saved-cards">
        <h2>Сохранённые открытки <span id="history-count" class="count">0</span></h2>
        <button id="clear-history" class="clear">Очистить историю</button>
        <div id="history" class="postcard-history"></div>
        <p id="history-empty">Здесь пока пусто.</p>
      </section>
    </main>
    <script src="app.js?v=20261026-single1"></script>
  </body>
</html>
