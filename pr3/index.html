<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Стикеры</title>
    <link rel="stylesheet" href="../practice.css" />
  </head>
  <body class="practice pr3">
    <main class="notes">
      <h1>Мои стикеры</h1>
      <form id="sticker-form" class="add-note" novalidate>
        <input id="sticker-text" type="text" placeholder="Что нужно записать?" />
        <button type="submit">Добавить</button>
      </form>
      <div id="input-error" class="error"></div>
      <div class="notes-layout">
        <section>
          <h2>Стикеры <span id="tray-count" class="count">0</span></h2>
          <div id="tray" class="sticker-tray"></div>
          <button id="clear-tray" class="clear">Очистить поле</button>
        </section>
        <section>
          <h2>Доска <span id="board-count" class="count">0</span></h2>
          <div id="pinboard" class="pinboard">
            <div id="board-placeholder" class="pinboard-caption">Перетащите стикеры сюда</div>
          </div>
          <button id="clear-board" class="clear">Очистить доску</button>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
