<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Космическая бродилка</title>
    <link rel="stylesheet" href="../practice.css" />
  </head>
  <body class="practice pr1">
    <main class="game">
      <h1>Космическая бродилка</h1>
      <div class="game-layout">
        <aside class="players">
          <h2>Фишки</h2>
          <div id="shelf" class="token-shelf" tabindex="0"></div>
          <p id="active-player" class="active-player"></p>
          <div class="dice-row">
            <div id="dice" class="dice">—</div>
            <button id="roll">Бросить кубик</button>
          </div>
          <button id="reset" class="reset">Начать заново</button>
        </aside>
        <section class="route">
          <div id="board" class="game-grid"></div>
          <p class="game-help">
            Перетащи фишку на клетку или выбери фишку и нажми на клетку. Ходить по стрелкам.
          </p>
        </section>
      </div>
      <p id="event" class="message">Для начала выбери фишку.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
